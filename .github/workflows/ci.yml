name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Types, lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Reads packageManager from package.json (pnpm@12.18.0).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm fmt:check

  container:
    name: Container image and Wrangler config
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Built without build-args on purpose: OPENCODE_MAJOR defaults to 1, so
      # this run also proves the v1 rollback path still builds. Runs on every
      # event so a broken assertion cannot hide until a push to master.
      - name: Build image (v1 default)
        run: docker build -t cloud-code:ci-v1 .

      - name: Assert Python and Node.js runtimes
        run: |
          docker run --rm --entrypoint sh cloud-code:ci-v1 -c '
            set -e
            python -c "import ssl, sqlite3, sys; print(sys.version); assert sys.version_info[:2] == (3, 15); assert sys.version_info.releaselevel == \"final\""
            got=$(node --version)
            echo "Node.js $got"
            case "$got" in
              v24.*) ;;
              *) echo "::error::expected Node.js 24, got $got"; exit 1 ;;
            esac
          '

      - name: Assert v1 is installed
        run: |
          got=$(docker run --rm --entrypoint opencode cloud-code:ci-v1 --version)
          echo "opencode version: $got"
          case "${got#v}" in
            1.*) ;;
            *) echo "::error::expected a v1 release, got '$got'"; exit 1 ;;
          esac

      # Reads image_vars.OPENCODE_MAJOR from wrangler.jsonc (currently "2"),
      # builds the image and validates the Wrangler config. Needs no Cloudflare
      # credentials.
      - name: Build image (v2) and assert the plugin bundle
        run: |
          docker build --build-arg OPENCODE_MAJOR=2 -t cloud-code:ci-v2 .
          docker run --rm --entrypoint sh cloud-code:ci-v2 -c '
            set -e
            zstd -dc /opt/opencode-plugins.tar.zst | tar -xf - -C /tmp
            for pkg in node_modules/oh-my-opencode-slim node_modules/jsdom node_modules/@ast-grep/cli; do
              test -e "/tmp/$pkg" || { echo "::error::missing $pkg in the plugin bundle"; exit 1; }
            done
            echo "plugin bundle: $(du -sh /tmp/node_modules | cut -f1), entries: $(ls /tmp/node_modules | wc -l)"
            echo "archive: $(du -h /opt/opencode-plugins.tar.zst | cut -f1)"
          '

      - name: Wrangler dry-run deploy
        run: pnpm exec wrangler deploy --dry-run --outdir /tmp/dry-run
